<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <rect width="1440" height="900" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1440" height="64" fill="#0F172A"/>
  <rect x="32" y="16" width="32" height="32" rx="8" fill="#2563EB"/>
  <text x="48" y="38" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">CT</text>
  <text x="76" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">CollecTree</text>
  <text x="1408" y="38" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#CBD5E1">Diecast Collector Portfolio &amp; Social Trading</text>
  <g id="Frame/LoginCard">
    <rect x="460" y="150" width="520" height="580" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="720" y="210" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A">Log in to CollecTree</text>
    <text x="720" y="240" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#64748B">Track your diecast portfolio value in TRY and trade with collectors</text>
    <rect x="508" y="268" width="424" height="48" rx="8" fill="#FEE2E2" stroke="#FCA5A5"/>
    <text x="528" y="297" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#B91C1C">401 Unauthorized: Email or password is incorrect.</text>
    <text x="508" y="352" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Email address</text>
    <rect x="508" y="362" width="424" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="524" y="389" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0F172A">ata@collectree.dev</text>
    <text x="508" y="438" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Password</text>
    <rect x="508" y="448" width="424" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="524" y="475" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0F172A">••••••••••••</text>
    <g id="Button/Primary">
      <rect x="508" y="524" width="424" height="48" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/>
      <text x="720" y="553" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Log in</text>
    </g>
    <line x1="508" y1="606" x2="932" y2="606" stroke="#E2E8F0"/>
    <text x="720" y="642" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Don't have an account yet? <tspan fill="#2563EB" font-weight="600">Create an account</tspan></text>
    <text x="720" y="678" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">Or browse public collections as a Visitor</text>
  </g>
  <g id="Footer/Meta">
    <rect x="0" y="864" width="1440" height="36" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="32" y="887" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">CollecTree – Sprint 2 Prototype  |  Screen: Login</text>
    <text x="1408" y="887" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">API: POST /api/v1/auth/login [login]</text>
  </g>
</svg>