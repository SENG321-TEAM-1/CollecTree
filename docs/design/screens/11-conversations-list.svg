  <text x="180" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A">Messages</text>
  <text x="180" y="138" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#64748B">Direct conversations with other collectors (at most one conversation per pair of users — BR-12)</text>
  <rect x="180" y="162" width="1080" height="450" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="204" y="186" width="1032" height="96" rx="12" fill="#EFF6FF" stroke="#2563EB"/>
  <circle cx="256" cy="234" r="26" fill="#1E293B"/>
  <text x="256" y="241" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">BA</text>
  <text x="302" y="222" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">@berke_diecast</text>
  <text x="302" y="248" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#1E3A8A">The Huracan MGT00687 is still sealed in its box. Your GT3 RS + 300 TRY offer looks fair!</text>
  <text x="1212" y="222" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#3B82F6">2 min ago</text>
  <rect x="204" y="298" width="1032" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="256" cy="346" r="26" fill="#334155"/>
  <text x="256" y="353" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">EA</text>
  <text x="302" y="334" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">@elif_collector</text>
  <text x="302" y="360" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Thanks for accepting Offer #305! Let's meet at campus tomorrow for the handover.</text>
  <text x="1212" y="334" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">Yesterday</text>
  <rect x="204" y="414" width="1032" height="64" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="228" y="442" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">409 Conflict handling (BR-12):</text>
  <text x="228" y="462" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">Clicking "Send message" on a profile when a conversation already exists opens the existing conversation instead of showing an error.</text>
  <rect x="180" y="636" width="1080" height="170" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="6 4"/>
  <text x="208" y="668" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB">EMPTY STATE PREVIEW (WHEN INBOX IS EMPTY):</text>
  <text x="720" y="722" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">No conversations yet</text>
  <text x="720" y="750" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">Open any collector's public profile and click "Send message" to discuss a trade.</text>
  <g id="Footer/Meta">
    <rect x="0" y="864" width="1440" height="36" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="32" y="887" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">CollecTree – Sprint 2 Prototype  |  Screen: Conversations List</text>
    <text x="1408" y="887" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">API: GET /api/v1/conversations [listConversations], POST /api/v1/conversations [startConversation]</text>
