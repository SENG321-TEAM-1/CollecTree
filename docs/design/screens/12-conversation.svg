  <text x="270" y="147" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">Conversation #14  •  Only the two participants can read or send messages (BR-11)  •  Refreshed by polling</text>
  <rect x="1050" y="110" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1140" y="135" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A">View public profile</text>
