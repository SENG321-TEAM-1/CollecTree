  <text x="664" y="230" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#FFFFFF">Hi Berke! Is your MiniGT Lamborghini Huracan GT3 EVO2 (MGT00687)</text>
  <text x="664" y="252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#FFFFFF">unopened in its original box? I sent Offer #312 with my GT3 RS + 300 TRY.</text>
  <text x="1196" y="272" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#BFDBFE">You • 14:15</text>
  <rect x="220" y="308" width="580" height="82" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="244" y="338" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0F172A">Hi Ata! Yes, the Huracan MGT00687 is still sealed in its box.</text>
  <text x="244" y="360" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0F172A">Your GT3 RS + 300 TRY offer looks fair! Let's arrange delivery on campus.</text>
  <text x="244" y="380" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">@berke_diecast • 14:18</text>
  <rect x="640" y="416" width="580" height="64" rx="12" fill="#2563EB"/>
  <text x="664" y="446" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#FFFFFF">Great, once you accept Offer #312 we can meet at the engineering building!</text>
  <text x="1196" y="470" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#BFDBFE">You • 14:19</text>
  <line x1="180" y1="680" x2="1260" y2="680" stroke="#E2E8F0"/>
  <rect x="212" y="704" width="860" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="232" y="735" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0F172A">Type a message (1 to 1000 characters)...</text>
  <rect x="1090" y="704" width="140" height="52" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1160" y="735" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Send</text>
  <text x="212" y="784" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">Validation (400): Message text must be between 1 and 1000 characters. Payment and delivery are handled outside the platform (BR-10).</text>
